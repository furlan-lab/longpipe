[call_cache]
get = true
put = true

[scheduler]
container_backend = slurm_singularity
task_concurrency = 200
fail_fast = false

[file_io]
allow_any_input = true

[singularity]
exe = "/fh/fast/furlan_s/grp/software/singularity/bin/singularity"
run_options = ["--containall", "--nv"]

[task_runtime]
defaults = {
        "maxRetries": 2,
        "docker": "ubuntu:20.04"
    }

[slurm]
extra_args = "--partition campus-new --time=04:00:00 --comment 'run with miniwdl'"
