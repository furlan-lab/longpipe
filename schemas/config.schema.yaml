$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
required:
  - rawdir
  - runsheet
  - ref_fasta
  - fire_ref
  - hla_ref_fasta
  - chrom_sizes
  - ccre_peaks
  - ref_map_file
  - tertiary_map_file
  - wdl_singleton
  - fire_upstream_commit
  - fire_exclude_regions
  - cnv_excluded_regions
  - expected_cn_xx
  - expected_cn_xy
  - copy_pbwdl_tool
  - shrink_fire_bed_tool
properties:
  rawdir:
    type: string
    minLength: 1
  runsheet:
    type: string
    minLength: 1
  default_sex:
    type: string
    enum: [MALE, FEMALE]
    default: FEMALE
  hia5_gates_fiberseq:
    type: boolean
    default: true
  hla_mode:
    type: string
    enum: [contigs, reads]
    default: contigs
  scatac_sorted:
    type: boolean
    default: true
  fire_version:
    type: string
    const: v0.1.2
    default: v0.1.2
  fire_upstream_commit:
    type: string
    const: e7f2aae1f59bbb74c46e1f27936da380cb074704
  fire_min_mean_depth:
    type: number
    minimum: 0
    default: 8.0
  fire_min_coverage:
    type: integer
    minimum: 0
    default: 4
  fire_coverage_within_n_sd:
    type: number
    exclusiveMinimum: 0
    default: 5.0
  fire_filter_flag:
    type: integer
    minimum: 0
    default: 260
  fire_min_msp:
    type: integer
    minimum: 0
    default: 10
  fire_min_average_msp_size:
    type: integer
    minimum: 0
    default: 10
  fire_min_contig_length:
    type: integer
    minimum: 0
    default: 0
  fire_keep_chromosomes:
    type: string
    minLength: 1
    default: ".*"
  fire_haplotype_min_coverage:
    type: integer
    minimum: 1
    default: 10
  fire_haplotype_max_fdr:
    type: number
    minimum: 0
    maximum: 1
    default: 0.05
  fire_haplotype_qvalue:
    type: number
    minimum: 0
    maximum: 1
    default: 0.05
  wdl_preemptible:
    type: boolean
    default: true
  ref_fasta:
    type: string
    minLength: 1
  fire_ref:
    type: string
    minLength: 1
  hla_ref_fasta:
    type: string
    minLength: 1
  chrom_sizes:
    type: string
    minLength: 1
  ccre_peaks:
    type: object
    minProperties: 1
    propertyNames:
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
    additionalProperties:
      type: string
      minLength: 1
  ref_map_file:
    type: string
    minLength: 1
  tertiary_map_file:
    type: string
    minLength: 1
  wdl_singleton:
    type: string
    minLength: 1
  fire_exclude_regions:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  cnv_excluded_regions:
    type: string
    minLength: 1
  expected_cn_xx:
    type: string
    minLength: 1
  expected_cn_xy:
    type: string
    minLength: 1
  miniwdl_executable:
    type: string
    minLength: 1
    default: miniwdl
  copy_pbwdl_tool:
    type: string
    minLength: 1
  shrink_fire_bed_tool:
    type: string
    minLength: 1
