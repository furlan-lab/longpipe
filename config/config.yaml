# Batch settings
rawdir: /fh/fast/furlan_s/SR/ngs/pacbio
runsheet: runsheet.csv
default_sex: FEMALE
hia5_gates_fiberseq: true
hla_mode: contigs
scatac_sorted: true
fire_version: v0.1.2
fire_upstream_commit: e7f2aae1f59bbb74c46e1f27936da380cb074704
fire_min_mean_depth: 8.0
fire_min_coverage: 4
fire_coverage_within_n_sd: 5.0
fire_filter_flag: 260
fire_min_msp: 10
fire_min_average_msp_size: 10
fire_min_contig_length: 0
fire_keep_chromosomes: ".*"
fire_haplotype_min_coverage: 10
fire_haplotype_max_fdr: 0.05
fire_haplotype_qvalue: 0.05
wdl_preemptible: true

# References
ref_fasta: /fh/fast/furlan_s/grp/refs/long_read_refs/hifi-wdl-resources-v3.1.0/GRCh38/human_GRCh38_no_alt_analysis_set.fasta
fire_ref: /fh/fast/furlan_s/grp/refs/long_read_refs/hifi-wdl-resources-v3.1.0/GRCh38/human_GRCh38_no_alt_analysis_set.fasta
hla_ref_fasta: /fh/fast/furlan_s/grp/refs/GRCh38/GRCh38_no_alt.fa
chrom_sizes: /fh/fast/furlan_s/grp/refs/long_read_refs/hifi-wdl-resources-v3.1.0/GRCh38/chrom_sizes
ccre_peaks:
  brain_atac: /fh/fast/furlan_s/grp/experiments/tumor_fiberseq/SMHF/refs/cCRE_features.bed.gz
  marrow_atac: /fh/fast/furlan_s/grp/experiments/tumor_fiberseq/GL_ATAC/scATACpeaks_karyotypic_hg38.bed

ref_map_file: /fh/fast/furlan_s/grp/refs/long_read_refs/hifi-wdl-resources-v3.1.0/GRCh38.ref_map.v3p1p0.tsv
tertiary_map_file: /fh/fast/furlan_s/grp/refs/long_read_refs/hifi-wdl-resources-v3.1.0/GRCh38.tertiary_map.v3p1p0.tsv
wdl_singleton: /fh/fast/furlan_s/grp/software/HiFi-human-WGS-WDL/workflows/singleton.wdl

fire_exclude_regions:
  - /fh/fast/furlan_s/grp/software/FIRE/workflow/annotations/hg38.gap.bed.gz
  - /fh/fast/furlan_s/grp/software/FIRE/workflow/annotations/hg38.blacklist.ENCFF356LFX.bed.gz
  - /fh/fast/furlan_s/grp/software/FIRE/workflow/annotations/SDs.merged.hg38.bed.gz
cnv_excluded_regions: /fh/fast/furlan_s/grp/refs/long_read_refs/hifi-wdl-resources-v3.1.0/GRCh38/sawfish/annotation_and_common_cnv.hg38.bed.gz
expected_cn_xx: /fh/fast/furlan_s/grp/refs/long_read_refs/hifi-wdl-resources-v3.1.0/GRCh38/sawfish/expected_cn.hg38.XX.bed
expected_cn_xy: /fh/fast/furlan_s/grp/refs/long_read_refs/hifi-wdl-resources-v3.1.0/GRCh38/sawfish/expected_cn.hg38.XY.bed

# Externally managed workflow driver and local helper programs
miniwdl_executable: /fh/fast/furlan_s/grp/software/miniwdl/bin/miniwdl
# Set this to a wrapper around a CUDA/libtorch-enabled ft build for kinetics BAMs.
ft_predict_executable: ft
fiberseq_detection_reads: 5000
fiberseq_detection_min_fraction: 0.5
copy_pbwdl_tool: /fh/fast/furlan_s/grp/software/pacbiowdlR/target/release/copy_pbWDL
shrink_fire_bed_tool: /fh/fast/furlan_s/grp/software/pacbiowdlR/target/release/shrink_fire_bed
