[package]
name = "longpipe-tools"
version = "0.3.0"
description = "Native helper tools built and used by Longpipe"
edition = "2021"
license = "GPL-3.0-only"
publish = false
autobins = false

[dependencies]
anyhow = "=1.0.102"
clap = { version = "=4.5.49", features = ["derive"] }
flate2 = "=1.1.8"
rayon = "=1.11.0"
serde_json = "=1.0.145"

[[bin]]
name = "copy_pbWDL"
path = "src/bin/copy_pbwdl.rs"

[[bin]]
name = "shrink_fire_bed"
path = "src/bin/shrink_fire_bed.rs"
