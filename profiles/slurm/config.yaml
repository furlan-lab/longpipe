executor: slurm
jobs: 100
# Snakemake 9.24.0 uses cores to size its local worker pool in SLURM mode.
cores: 11
local-cores: 11
latency-wait: 120
keep-going: true
rerun-incomplete: true
printshellcmds: true
show-failed-logs: true
use-conda: true
slurm-efficiency-report: true
slurm-logdir: logs/slurm
slurm-pass-command-as-script: true
default-resources:
  mem_mb: 4000
  runtime: 60
  slurm_partition: campus-new
resources:
  wdl_driver: 10
  fire_driver: 1
  io_heavy: 2
